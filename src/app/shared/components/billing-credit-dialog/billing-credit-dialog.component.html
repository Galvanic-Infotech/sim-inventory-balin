<div class="dialog-backdrop" (click)="close(false)" aria-hidden="true">
  <aside class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="credit-title" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h3 id="credit-title">
        <span class="material-icons" style="vertical-align: middle; color: var(--color-success); margin-right: 8px">savings</span>
        {{ 'billing.credit.title' | translate }}
      </h3>
      <button type="button" class="btn btn-ghost" [disabled]="saving()" (click)="close(false)" [attr.aria-label]="'common.close' | translate">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="dialog-body">
      @if (entityName()) {
        <div class="assign-entity-banner" style="margin-bottom: var(--space-md)">
          <span class="material-icons">business</span>
          <strong>{{ entityName() }}</strong>
        </div>
      }

      @if (error()) {
        <div class="alert alert-danger">
          <span class="material-icons">error</span> {{ error() }}
        </div>
      }

      <div class="form-group">
        <label>{{ 'billing.config.productType' | translate }}</label>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          @for (type of productTypes; track type) {
            <button
              type="button"
              class="btn"
              [class.btn-primary]="productType === type"
              [class.btn-outline]="productType !== type"
              (click)="productType = type"
            >
              {{ ('billing.productType.' + (type === BillingProductType.Sim ? 'sim' : 'license')) | translate }}
            </button>
          }
        </div>
      </div>

      <div class="form-group">
        <label>{{ 'billing.credit.amount' | translate }} *</label>
        <input
          class="form-control"
          type="number"
          min="0"
          step="0.01"
          [(ngModel)]="amount"
          [placeholder]="'billing.credit.amountPlaceholder' | translate"
        />
      </div>

      <div class="form-group">
        <label>{{ 'billing.credit.notes' | translate }}</label>
        <textarea
          class="form-control"
          rows="3"
          maxlength="500"
          [(ngModel)]="notes"
          [placeholder]="'billing.credit.notesPlaceholder' | translate"
        ></textarea>
      </div>
    </div>

    <div class="dialog-footer">
      <button type="button" class="btn btn-outline" [disabled]="saving()" (click)="close(false)">
        {{ 'common.cancel' | translate }}
      </button>
      <button type="button" class="btn btn-primary" [disabled]="saving()" (click)="submit()">
        @if (saving()) { <span class="spinner"></span> } @else { <span class="material-icons">add</span> }
        {{ 'billing.credit.submit' | translate }}
      </button>
    </div>
  </aside>
</div>
